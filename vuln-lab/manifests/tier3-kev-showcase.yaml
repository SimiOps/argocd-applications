# GERADO POR hack/gen-workloads.sh — NAO EDITE A MAO.
# Fonte: hack/images.txt   |   Tier 3: Showcase CISA KEV / actually exploitable (opt-in, mais pesado)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: log4shell-app
  labels:
    app.kubernetes.io/name: log4shell-app
    app.kubernetes.io/part-of: vuln-lab
    vuln-lab/tier: "3"
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    vuln-lab/image-size: "250MB"
    vuln-lab/note: "CVE-2021-44228, esta na CISA KEV"
spec:
  replicas: 1
  revisionHistoryLimit: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: log4shell-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: log4shell-app
        app.kubernetes.io/part-of: vuln-lab
        vuln-lab/tier: "3"
    spec:
      priorityClassName: vuln-lab-low
      terminationGracePeriodSeconds: 1
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        - name: idle
          image: ghcr.io/christophetd/log4shell-vulnerable-app:latest
          imagePullPolicy: IfNotPresent
          # 'sleep infinity' nao existe no busybox de imagens antigas; este loop
          # funciona em qualquer /bin/sh (glibc, musl, dash).
          command: ["/bin/sh", "-c", "while :; do sleep 3600; done"]
          resources:
            requests:
              cpu: 1m
              memory: 8Mi
            limits:
              cpu: 50m
              memory: 48Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
