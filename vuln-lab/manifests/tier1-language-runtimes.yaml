# GERADO POR hack/gen-workloads.sh — NAO EDITE A MAO.
# Fonte: hack/images.txt   |   Tier 1: Runtimes de linguagem — CVEs de app-level e bibliotecas
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-36
  labels:
    app.kubernetes.io/name: python-36
    app.kubernetes.io/part-of: vuln-lab
    vuln-lab/tier: "1"
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    vuln-lab/image-size: "60MB"
    vuln-lab/note: "CPython EOL + libs de sistema"
spec:
  replicas: 1
  revisionHistoryLimit: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: python-36
  template:
    metadata:
      labels:
        app.kubernetes.io/name: python-36
        app.kubernetes.io/part-of: vuln-lab
        vuln-lab/tier: "1"
    spec:
      priorityClassName: vuln-lab-low
      terminationGracePeriodSeconds: 1
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        - name: idle
          image: python:3.6-slim
          imagePullPolicy: IfNotPresent
          # 'sleep infinity' nao existe no busybox de imagens antigas; este loop
          # funciona em qualquer /bin/sh (glibc, musl, dash).
          command: ["/bin/sh", "-c", "while :; do sleep 3600; done"]
          resources:
            requests:
              cpu: 1m
              memory: 8Mi
            limits:
              cpu: 50m
              memory: 48Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
