# GERADO POR hack/gen-workloads.sh — NAO EDITE A MAO.
# Fonte: hack/images.txt   |   Tier 0: Distros EOL — base de CVEs de sistema operacional
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: debian-9-stretch
  labels:
    app.kubernetes.io/name: debian-9-stretch
    app.kubernetes.io/part-of: vuln-lab
    vuln-lab/tier: "0"
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    vuln-lab/image-size: "45MB"
    vuln-lab/note: "EOL 2022, centenas de CVEs de OS"
spec:
  replicas: 1
  revisionHistoryLimit: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: debian-9-stretch
  template:
    metadata:
      labels:
        app.kubernetes.io/name: debian-9-stretch
        app.kubernetes.io/part-of: vuln-lab
        vuln-lab/tier: "0"
    spec:
      priorityClassName: vuln-lab-low
      terminationGracePeriodSeconds: 1
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        - name: idle
          image: debian:9
          imagePullPolicy: IfNotPresent
          # 'sleep infinity' nao existe no busybox de imagens antigas; este loop
          # funciona em qualquer /bin/sh (glibc, musl, dash).
          command: ["/bin/sh", "-c", "while :; do sleep 3600; done"]
          resources:
            requests:
              cpu: 1m
              memory: 8Mi
            limits:
              cpu: 50m
              memory: 48Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
