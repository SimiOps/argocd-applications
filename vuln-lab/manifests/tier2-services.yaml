# GERADO POR hack/gen-workloads.sh — NAO EDITE A MAO.
# Fonte: hack/images.txt   |   Tier 2: Servicos e app servers — CVEs nomeados e conhecidos
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-114
  labels:
    app.kubernetes.io/name: nginx-114
    app.kubernetes.io/part-of: vuln-lab
    vuln-lab/tier: "2"
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    vuln-lab/image-size: "60MB"
    vuln-lab/note: "CVEs de nginx conhecidos"
spec:
  replicas: 1
  revisionHistoryLimit: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: nginx-114
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nginx-114
        app.kubernetes.io/part-of: vuln-lab
        vuln-lab/tier: "2"
    spec:
      priorityClassName: vuln-lab-low
      terminationGracePeriodSeconds: 1
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        - name: idle
          image: nginx:1.14
          imagePullPolicy: IfNotPresent
          # 'sleep infinity' nao existe no busybox de imagens antigas; este loop
          # funciona em qualquer /bin/sh (glibc, musl, dash).
          command: ["/bin/sh", "-c", "while :; do sleep 3600; done"]
          resources:
            requests:
              cpu: 1m
              memory: 8Mi
            limits:
              cpu: 50m
              memory: 48Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
